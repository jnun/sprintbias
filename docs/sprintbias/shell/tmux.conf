# SprintBias tmux settings — a status bar that always says which machine
# you are on, plus a few comfortable defaults.
#
# Installed by `./sprint.sh shell install`, which adds one marked
# `source-file` line to your tmux config. Your own settings after that line
# still win. Remove with `./sprint.sh shell remove`.
# Reload a running tmux:  tmux source-file ~/.tmux.conf

# ── Which machine am I on? ───────────────────────────────────────────
# Status bar starts with the short host name. Over SSH the whole bar turns
# red, so a remote tmux never looks like the one on your laptop.
set -g status-left-length 40
set -g status-left "#[bold] #h #[nobold]| #S | "
set -g status-right "#{=40:pane_title} | %a %b %d %H:%M "
set -g status-interval 5
if-shell '[ -n "$SSH_CONNECTION" ]' \
  'set -g status-style "bg=colour52,fg=colour255"' \
  'set -g status-style "bg=colour236,fg=colour250"'

# Your terminal tab / window title: host - session - window.
set -g set-titles on
set -g set-titles-string "#h - #S - #W"

# ── Comfortable defaults ─────────────────────────────────────────────
set -g mouse on                 # click panes, drag borders, scroll
set -g history-limit 50000      # more scrollback
set -g escape-time 10           # no lag after Esc (vim, editors)
set -g base-index 1             # windows count from 1, like the keyboard
setw -g pane-base-index 1
set -g renumber-windows on

# New windows and splits open in the folder you are already in.
#   Ctrl-b |  split side by side      Ctrl-b -  split top and bottom
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
